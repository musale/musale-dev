<script>
  const menuButton = document.querySelector(".menu-trigger");
  const navigation = document.querySelector(".menu");

  if (menuButton && navigation) {
    navigation.id = "primary-menu";
    const syncMenuState = () => {
      menuButton.setAttribute("aria-expanded", String(!navigation.classList.contains("hidden")));
    };
    new MutationObserver(syncMenuState).observe(navigation, { attributes: true, attributeFilter: ["class"] });
    syncMenuState();

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !menuButton.classList.contains("hidden") && !navigation.classList.contains("hidden")) {
        navigation.classList.add("hidden");
        menuButton.focus();
      }
    });
  }
</script>

{{- if .Store.Get "hasMermaid" -}}
<style>
  .mermaid {
    overflow-x: auto;
  }

  .mermaid svg {
    display: block;
    margin-inline: auto;
  }
</style>
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.12.0/dist/mermaid.esm.min.mjs";

  mermaid.initialize({
    startOnLoad: true,
    theme: "dark",
    fontFamily: '"Fira Code", Monaco, Consolas, monospace',
    themeVariables: {
      fontSize: "11pt"
    },
    securityLevel: "strict"
  });
</script>
{{- end -}}
