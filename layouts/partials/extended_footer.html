{{- if .Store.Get "hasMermaid" -}}
<style>
  .mermaid {
    overflow-x: auto;
  }

  .mermaid svg {
    display: block;
    margin-inline: auto;
  }
</style>
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.12.0/dist/mermaid.esm.min.mjs";

  mermaid.initialize({
    startOnLoad: true,
    theme: "dark",
    fontFamily: '"Fira Code", Monaco, Consolas, monospace',
    themeVariables: {
      fontSize: "11pt"
    },
    securityLevel: "strict"
  });
</script>
{{- end -}}
