<ul class="article-list">
  {{ range . }}
    <li class="article-list__item">
      <article>
        <time class="article-list__date" datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
        <h3 class="article-list__title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
        {{ $description := .Description | default (.Summary | plainify) }}
        {{ with $description }}
          <p class="article-list__summary">{{ . | markdownify | plainify | htmlUnescape | truncate 180 }}</p>
        {{ end }}
      </article>
    </li>
  {{ end }}
</ul>
